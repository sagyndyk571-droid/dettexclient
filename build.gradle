plugins {
    id 'net.fabricmc.fabric-loom-remap' version "${loom_version}"
    id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

repositories {
    maven { url 'https://jitpack.io' }
    maven { url = 'https://maven.maxhenkel.de/repository/public' }
    maven {
        name = 'Modrinth'
        url = 'https://api.modrinth.com/maven'
    }
    mavenCentral()
}

loom {
    accessWidenerPath = file("src/main/resources/accesswidener")
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
    include(modImplementation('io.netty:netty-handler-proxy:4.1.82.Final'))
    include(modImplementation('io.netty:netty-codec-socks:4.1.82.Final'))
    include(implementation('org.luaj:luaj-jse:3.0.1'))
    include(implementation('dev.redstones.mediaplayerinfo:media-player-info:0.1.0'))
    include(implementation('org.jetbrains.kotlin:kotlin-stdlib:1.9.20'))
    include(implementation('org.jetbrains.kotlinx:kotlinx-serialization-core-jvm:1.6.3'))
compileOnly 'org.projectlombok:lombok:1.18.48'
    annotationProcessor 'org.projectlombok:lombok:1.18.48'
    modCompileOnly "de.maxhenkel.voicechat:voicechat-api:2.6.0"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"

    // Оптимизация (Sodium / Iris / Sodium Extra) — в dev-рантайме и в jar через jar-in-jar
    include(modImplementation "maven.modrinth:sodium:mc1.21.11-0.8.14-fabric")
    include(modImplementation "maven.modrinth:iris:1.10.8+1.21.11-fabric")
    include(modImplementation "maven.modrinth:sodium-extra:mc1.21.11-0.9.4+fabric")

    
    // Testing dependencies
    testImplementation 'org.junit.jupiter:junit-jupiter-api:5.10.1'
    testRuntimeOnly 'org.junit.jupiter:junit-jupiter-engine:5.10.1'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher:1.10.1'
    testImplementation 'net.jqwik:jqwik:1.8.2'
}

processResources {
    inputs.property "version", project.version
    exclude "assets/neverlose/cosmetic/**/*.lua"
    exclude "assets/neverlose/cosmetic/**/*.ogg"
    exclude "assets/neverlose/cosmetic/**/.DS_Store"
    filesMatching("fabric.mod.json") {
        expand "version": inputs.properties.version
    }
}

tasks.withType(JavaCompile).configureEach {
    it.options.release = 21
}

test {
    useJUnitPlatform {
        includeEngines 'jqwik', 'junit-jupiter'
    }
}

java {
    withSourcesJar()
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
}

jar {
    inputs.property "archivesName", project.base.archivesName
    from("LICENSE") {
        rename { "${it}_${inputs.properties.archivesName}"}
    }
}

publishing {
    publications {
        create("mavenJava", MavenPublication) {
            artifactId = project.archives_base_name
            from components.java
        }
    }
    repositories {
    }
}
